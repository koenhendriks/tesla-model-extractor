[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tesla-model-extractor"
version = "0.3.0"
description = "Extract the 3D vehicle models, materials and animations from your own copy of the Tesla app: GLB for Unreal / Blender / any glTF importer, or asset packs for the Tesla View Home Assistant card"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Koen Hendriks" }]
keywords = ["tesla", "3d-models", "gltf", "glb", "unreal-engine", "blender", "godot", "asset-extraction", "home-assistant"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
tesla-model-extract = "tesla_model_extractor.cli:main"
tesla-view-extract = "tesla_model_extractor.cli:main"  # name of the tool before 0.3; kept for existing docs and scripts

[project.urls]
Homepage = "https://github.com/koenhendriks/tesla-model-extractor"
Issues = "https://github.com/koenhendriks/tesla-model-extractor/issues"
"Tesla View (Home Assistant integration)" = "https://github.com/koenhendriks/tesla-view"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_model_extractor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
